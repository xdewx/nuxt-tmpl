packages:
    - "."
    # - "../nuxt-tmpl-mono/packages/*"
    # - "../../@ipa-schema/packages/*"
    # - "../../ipa-vue-mono/packages/*"

overrides:
    #'@nuxt-tmpl/nuxt': workspace:*
    #'@nuxt-tmpl/core': workspace:*
    "@nuxt-tmpl/nuxt": "0.2.4"
    "@nuxt-tmpl/core": "0.2.1"
    "@ipa-vue/core": "0.3.3"
    "@ipa-vue/element-plus": "0.3.3"
allowBuilds:
    better-sqlite3: true
    "@clerk/shared": true
    "@parcel/watcher": true
    "@prisma/engines": true
    esbuild: true
    prisma: true
    sharp: true
    unrs-resolver: true
    vue-demi: true
minimumReleaseAgeExclude:
    - vue-router@5.1.0
    - "@nuxt-tmpl/*"
    - "@ipa-vue/*"
